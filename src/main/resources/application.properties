# Production configuration. Provide all database values through the environment.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon requires TLS. Its connection string may also include sslmode=require.
spring.datasource.hikari.data-source-properties.sslmode=${DATABASE_SSLMODE:require}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8080}
server.address=0.0.0.0

# Render's filesystem is ephemeral. Set APP_STORAGE_PATH to a mounted path only
# when persistent storage is available; otherwise uploaded files last for a run.
app.storage.root=${APP_STORAGE_PATH:./photos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
